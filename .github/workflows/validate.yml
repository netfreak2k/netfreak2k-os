name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          bash -n install.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          shellcheck install.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Python syntax
        run: |
          python3 -m py_compile server/api/server.py
          python3 -m py_compile server/collector/collector.py
          python3 -m py_compile host/vm-agent.py

      - name: JavaScript syntax
        run: node --check dashboard/app.js

      - name: Repository preflight
        run: bash scripts/preflight.sh

      - name: Validate server compose
        run: docker compose -f server/docker-compose.yml config

      - name: Build server containers
        run: docker compose -f server/docker-compose.yml build

      - name: Server smoke test
        env:
          N2K_HTTP_PORT: "18080"
        run: |
          sudo mkdir -p /run/netfreak2k
          sudo install -d -m 0770 -o 65534 -g 65534 /srv/netfreak2k /srv/netfreak2k/users /srv/netfreak2k/shared
          docker compose -f server/docker-compose.yml down -v --remove-orphans || true
          docker compose -f server/docker-compose.yml up -d

          docker exec netfreak2k-api sh -c 'id && ls -ld /workspace /workspace/users /workspace/shared'
          docker exec netfreak2k-api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/setup').read().decode())"
          docker exec netfreak2k-web getent hosts netfreak2k-api
          docker exec netfreak2k-web wget -qO- http://netfreak2k-api:8080/setup || true

          ready=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18080/api/setup | grep -q '"configured":false'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            docker logs netfreak2k-web || true
            docker logs netfreak2k-api || true
            exit 1
          fi

          set +e
          SETUP_RESPONSE="$(curl --retry 8 --retry-delay 1 --retry-all-errors -fsS -c /tmp/n2k-cookies.txt -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"ci-test-password-123"}' http://127.0.0.1:18080/api/setup)"
          setup_rc=$?
          set -e
          if [[ "$setup_rc" -ne 0 ]]; then
            docker logs netfreak2k-web || true
            docker logs netfreak2k-api || true
            exit "$setup_rc"
          fi
          printf '%s\n' "$SETUP_RESPONSE" | grep -q '"authenticated":true'
          CSRF="$(printf '%s' "$SETUP_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrf"])')"

          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/status | grep -q '"product":"Netfreak2k Server-OS"'
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/overview | grep -q '"network":'
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:18080/api/update/progress | grep -q '"state":'
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/media/devices | grep -q '"devices":'
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/media/library | grep -q '"tracks":'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'N2K DESKTOP'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'N2K MEDIA CENTER'
          curl -fsS -o /tmp/n2k-media-center.css http://127.0.0.1:18080/media-center.css
          test -s /tmp/n2k-media-center.css
          curl -fsS -o /tmp/n2k-wallpaper.webp http://127.0.0.1:18080/assets/wallpapers/01-night-bay.webp
          test -s /tmp/n2k-wallpaper.webp
          curl -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/preferences | grep -q '"wallpaper":"01-night-bay"'
          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"key":"wallpaper","value":"09-cyber-city"}' http://127.0.0.1:18080/api/preferences | grep -q '"wallpaper":"09-cyber-city"'
          curl -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/preferences | grep -q '"wallpaper":"09-cyber-city"'
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt 'http://127.0.0.1:18080/api/workspace?area=documents' | grep -q '"area":"documents"'
          printf 'hello n2k\n' >/tmp/n2k-drive-test.txt
          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/octet-stream' --data-binary @/tmp/n2k-drive-test.txt 'http://127.0.0.1:18080/api/workspace/upload?area=documents&path=&name=drive-test.txt' | grep -q '"uploaded":true'
          curl -fsS -b /tmp/n2k-cookies.txt 'http://127.0.0.1:18080/api/search?q=drive-test' | grep -q '"name":"drive-test.txt"'
          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"area":"documents","path":"","old_name":"drive-test.txt","new_name":"drive-renamed.txt"}' http://127.0.0.1:18080/api/workspace/rename | grep -q '"renamed":true'

          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"area":"documents","path":"","name":"drive-renamed.txt"}' http://127.0.0.1:18080/api/favorites/toggle | grep -q '"favorite":true'
          curl -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/favorites | grep -q '"name":"drive-renamed.txt"'

          printf 'hello n2k v2\n' >/tmp/n2k-drive-test-v2.txt
          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/octet-stream' --data-binary @/tmp/n2k-drive-test-v2.txt 'http://127.0.0.1:18080/api/workspace/upload?area=documents&path=&name=drive-renamed.txt&replace=1' | grep -q '"replaced":true'
          VERSION_RESPONSE="$(curl -fsS -b /tmp/n2k-cookies.txt 'http://127.0.0.1:18080/api/workspace/versions?area=documents&path=&name=drive-renamed.txt')"
          VERSION_ID="$(printf '%s' "$VERSION_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versions"][0]["id"])')"
          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d "{\"id\":$VERSION_ID}" http://127.0.0.1:18080/api/workspace/version/restore | grep -q '"restored":true'
          curl -fsS -b /tmp/n2k-cookies.txt 'http://127.0.0.1:18080/api/workspace/file?area=documents&path=&name=drive-renamed.txt' | grep -q 'hello n2k'

          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"mode":"copy","source_area":"documents","source_path":"","name":"drive-renamed.txt","target_area":"personal","target_path":""}' http://127.0.0.1:18080/api/workspace/transfer | grep -q '"transferred":true'
          curl -fsS -b /tmp/n2k-cookies.txt 'http://127.0.0.1:18080/api/workspace?area=personal' | grep -q '"name":"drive-renamed.txt"'

          SHARE_RESPONSE="$(curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"area":"documents","path":"","name":"drive-renamed.txt","hours":1}' http://127.0.0.1:18080/api/workspace/share)"
          SHARE_TOKEN="$(printf '%s' "$SHARE_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          curl -fsS "http://127.0.0.1:18080/api/share?token=$SHARE_TOKEN" | grep -q 'hello n2k'
          curl -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/shares | grep -Fq -- "$SHARE_TOKEN"
          curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d "{\"token\":\"$SHARE_TOKEN\"}" http://127.0.0.1:18080/api/shares/revoke | grep -q '"revoked":true'

          SYNC_RESPONSE="$(curl -fsS -b /tmp/n2k-cookies.txt -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"label":"CI Sync"}' http://127.0.0.1:18080/api/sync/credentials/create)"
          SYNC_PASSWORD="$(printf '%s' "$SYNC_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')"
          curl -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/sync/credentials | grep -q '"label":"CI Sync"'

          printf 'hello webdav\n' >/tmp/n2k-webdav.txt
          curl -fsS -u "ciadmin:$SYNC_PASSWORD" -X PUT --data-binary @/tmp/n2k-webdav.txt http://127.0.0.1:18080/dav/files/Dokumente/webdav-test.txt
          curl -fsS -u "ciadmin:$SYNC_PASSWORD" -X PROPFIND -H 'Depth: 1' http://127.0.0.1:18080/dav/files/Dokumente/ | grep -q 'webdav-test.txt'
          curl -fsS -u "ciadmin:$SYNC_PASSWORD" http://127.0.0.1:18080/dav/files/Dokumente/webdav-test.txt | grep -q 'hello webdav'

          printf '%s\r\n' 'BEGIN:VCALENDAR' 'VERSION:2.0' 'PRODID:-//Netfreak2k CI//DE' 'BEGIN:VEVENT' 'UID:ci-sync-test@netfreak2k' 'DTSTAMP:20261006T070000Z' 'DTSTART:20261007T120000Z' 'DTEND:20261007T123000Z' 'SUMMARY:CI Sync Termin' 'DESCRIPTION:CalDAV smoke test' 'END:VEVENT' 'END:VCALENDAR' > /tmp/n2k-caldav.ics
          curl -fsS -u "ciadmin:$SYNC_PASSWORD" -X PUT -H 'Content-Type: text/calendar' --data-binary @/tmp/n2k-caldav.ics http://127.0.0.1:18080/dav/calendars/ciadmin/default/ci-sync-test@netfreak2k.ics
          set +e
          REPORT_RESPONSE="$(curl -sS -u "ciadmin:$SYNC_PASSWORD" -X REPORT -H 'Depth: 1' -H 'Content-Type: application/xml' --data '<c:calendar-query xmlns:c="urn:ietf:params:xml:ns:caldav" xmlns:d="DAV:"><d:prop><d:getetag/><c:calendar-data/></d:prop><c:filter><c:comp-filter name="VCALENDAR"/></c:filter></c:calendar-query>' http://127.0.0.1:18080/dav/calendars/ciadmin/default/)"
          report_rc=$?
          set -e
          if [[ "$report_rc" -ne 0 ]] || ! printf '%s' "$REPORT_RESPONSE" | grep -q 'CI Sync Termin'; then
            printf '%s\n' "$REPORT_RESPONSE"
            docker logs netfreak2k-api || true
            docker logs netfreak2k-web || true
            exit 1
          fi
          curl -fsS -u "ciadmin:$SYNC_PASSWORD" http://127.0.0.1:18080/dav/calendars/ciadmin/default/ci-sync-test@netfreak2k.ics | grep -q 'CI Sync Termin'
          curl -fsS -u "ciadmin:$SYNC_PASSWORD" -X DELETE http://127.0.0.1:18080/dav/calendars/ciadmin/default/ci-sync-test@netfreak2k.ics

          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/calendar | grep -q '"events":'
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/homeassistant | grep -q '"available":false'

      - name: Media Center sanity
        run: |
          grep -q 'N2K MEDIA CENTER' dashboard/index.html
          grep -q 'initMediaCenter' dashboard/app.js
          grep -q 'audio_multiroom_set' host/vm-agent.py
          grep -q 'module-combine-sink' host/vm-agent.py
          grep -q 'media-library-list' dashboard/index.html
          grep -q 'media-spectrum' dashboard/index.html
          grep -q 'top-media-mute' dashboard/index.html
          grep -q 'Accept-Ranges' server/api/server.py
          grep -q 'MutagenFile' server/api/server.py
          grep -q 'mutagen==1.47.0' server/api/Dockerfile
          grep -q 'media-section-tabs' dashboard/index.html
          grep -q 'data-media-section="settings"' dashboard/index.html
          grep -q 'top-media-subtitle' dashboard/index.html
          grep -q 'data-media-group="settings"' dashboard/index.html
          grep -q 'radio_stream_metadata' server/api/server.py
          grep -q '/media/radio/metadata' server/api/server.py
          grep -q 'media-rds-badge' dashboard/index.html
          grep -q 'top-media-volume' dashboard/index.html
          grep -q 'top-media-art' dashboard/index.html
          grep -q 'system-nav-group' dashboard/index.html
          grep -q 'overview-cpu-cores' dashboard/index.html
          grep -q 'cpu_topology' server/api/server.py
          grep -q 'setSystemNavOpen' dashboard/app.js
          grep -q 'pollRadioMetadata' dashboard/app.js
          grep -q 'N2K_SEARCH_COMMANDS' dashboard/app.js
          grep -q 'renderMediaQueue' dashboard/app.js
          grep -q 'n2k-toast-stack' dashboard/index.html
          grep -q 'pipewire-pulse' install.sh
          grep -q 'libspa-0.2-bluetooth' scripts/update-server.sh
          grep -q '/media/multiroom' server/api/server.py

      - name: HTTPS Remote Access sanity
        run: |
          grep -q 'remote-access-card' dashboard/index.html
          grep -q 'loadRemoteAccess' dashboard/app.js
          grep -q '/remote-access/configure' server/api/server.py
          grep -q 'remote_access_configure' host/vm-agent.py
          grep -q 'N2K_BACKEND_PORT' server/docker-compose.yml
          grep -q 'configure-gateway.sh' install.sh
          grep -q 'configure-gateway.sh' scripts/update-server.sh
          grep -q 'nginx' scripts/configure-gateway.sh
          grep -q 'certbot' scripts/configure-gateway.sh
          test -f host/netfreak2k-cert-renew.service
          test -f host/netfreak2k-cert-renew.timer

      - name: Jobs Scheduler 2.0 sanity
        run: |
          grep -q 'scheduler-panel' dashboard/index.html
          grep -q 'loadScheduler' dashboard/app.js
          grep -q '/scheduler/run' server/api/server.py
          grep -q 'scheduler_status_payload' host/vm-agent.py
          grep -q 'systemd_timer_inventory' host/vm-agent.py
          grep -q 'scheduler_run' host/vm-agent.py
          grep -q 'scheduler-job-row' dashboard/styles.css

      - name: Remote Connectivity 2.0 sanity
        run: |
          grep -q 'remote-connectivity-grid' dashboard/index.html
          grep -q 'loadRemoteConnectivity' dashboard/app.js
          grep -q '/remote-access/connectivity' server/api/server.py
          grep -q 'remote_connectivity_status' host/vm-agent.py
          grep -q 'dns_matches_public_ip' host/vm-agent.py
          grep -q 'outside_in_verified' host/vm-agent.py
          grep -q 'remote-connectivity-row' dashboard/styles.css

      - name: Monitoring Automation 2.0 sanity
        run: |
          grep -q 'monitoring-automation-card' dashboard/index.html
          grep -q 'loadMonitoringPolicy' dashboard/app.js
          grep -q '/monitoring/policy' server/api/server.py
          grep -q 'monitoring_policy_payload' server/api/server.py
          grep -q 'monitoring_policy_update' server/api/server.py
          grep -q 'maintenance_mode' server/api/server.py
          grep -q 'quiet_active' server/api/server.py
          grep -q 'monitoring-policy-grid' dashboard/styles.css

      - name: Security Hardening 2.0 sanity
        run: |
          grep -q 'security-host-hardening' dashboard/index.html
          grep -q 'loadHostSecurity' dashboard/app.js
          grep -q '/security/host' server/api/server.py
          grep -q 'security_status_payload' host/vm-agent.py
          grep -q 'security_listening_sockets' host/vm-agent.py
          grep -q 'security_firewall_status' host/vm-agent.py
          grep -q 'security_failed_logins' host/vm-agent.py
          grep -q 'security-hardening-summary' dashboard/styles.css

      - name: Update Recovery 2.0 sanity
        run: |
          grep -q 'update-safety-card' dashboard/index.html
          grep -q 'loadUpdatePreflight' dashboard/app.js
          grep -q '/updates/preflight' server/api/server.py
          grep -q 'update_safe_netfreak2k' server/api/server.py
          grep -q 'update_preflight_payload' host/vm-agent.py
          grep -q 'safe_trigger_update' host/vm-agent.py
          grep -q 'update-preflight-row' dashboard/styles.css

      - name: Virtualization 2.0 sanity
        run: |
          grep -q 'vm-kpi-grid' dashboard/index.html
          grep -q 'createVmSnapshot' dashboard/app.js
          grep -q '/vms/action' server/api/server.py
          grep -q '/vms/snapshot' server/api/server.py
          grep -q 'vm_details' host/vm-agent.py
          grep -q 'vm_snapshot_create' host/vm-agent.py
          grep -q 'vm-card-v2' dashboard/styles.css

      - name: Network 2.0 sanity
        run: |
          grep -q 'network-device-wake' dashboard/index.html
          grep -q 'wakeNetworkDevice' dashboard/app.js
          grep -q 'network-traffic-mode' dashboard/index.html
          grep -q '/network/device/wake' server/api/server.py
          grep -q 'network_device_wake' host/vm-agent.py
          grep -q 'online_since' host/vm-agent.py
          grep -q 'ip_change' host/vm-agent.py

      - name: Docker Apps 2.0 sanity
        run: |
          grep -q 'apps-kpi-grid' dashboard/index.html
          grep -q 'openAppDiagnostics' dashboard/app.js
          grep -q '/apps/logs' server/api/server.py
          grep -q '/apps/update-check' server/api/server.py
          grep -q 'docker_apps_payload' host/vm-agent.py
          grep -q 'docker_app_logs' host/vm-agent.py
          grep -q 'docker_app_update_check' host/vm-agent.py
          grep -q 'app-row-v2' dashboard/styles.css

      - name: Storage 2.0 sanity
        run: |
          grep -q 'storage-inventory-card' dashboard/index.html
          grep -q 'renderStorageInventory' dashboard/app.js
          grep -q '/storage/mount' server/api/server.py
          grep -q '/storage/unmount' server/api/server.py
          grep -q 'storage_device_inventory' host/vm-agent.py
          grep -q 'storage_mount_not_managed' host/vm-agent.py
          grep -q 'storage_raid_payload' host/vm-agent.py
          grep -q 'storage-device-row' dashboard/styles.css

      - name: Hardware Maintenance sanity
        run: |
          grep -q 'hardware-maintenance-card' dashboard/index.html
          grep -q 'loadHardwareMaintenance' dashboard/app.js
          grep -q '/hardware' server/api/server.py
          grep -q '/power/action' server/api/server.py
          grep -q 'hardware_status_payload' host/vm-agent.py
          grep -q 'host_power_action' host/vm-agent.py
          grep -q 'hardware-summary-grid' dashboard/styles.css

      - name: Users Security sanity
        run: |
          grep -q 'security-panel' dashboard/index.html
          grep -q 'login-totp' dashboard/index.html
          grep -q 'loadSecurity' dashboard/app.js
          grep -q 'CREATE TABLE IF NOT EXISTS audit_log' server/api/server.py
          grep -q 'def totp_code' server/api/server.py
          grep -q 'def require_admin' server/api/server.py
          grep -q '/security/users/create' server/api/server.py
          grep -q '/security/totp/confirm' server/api/server.py
          grep -q '/security/session/revoke' server/api/server.py

      - name: Backup Recovery sanity
        run: |
          grep -q 'backup-recovery-panel' dashboard/index.html
          grep -q 'saveBackupPolicy' dashboard/app.js
          grep -q 'testRestoreBackup' dashboard/app.js
          grep -q 'backup_test_restore' host/vm-agent.py
          grep -q 'backup_scheduled_tick' host/vm-agent.py
          grep -q '/backups/test-restore' server/api/server.py
          grep -q '/backups/policy' server/api/server.py
          grep -q 'netfreak2k-backup-scheduler.timer' install.sh
          grep -q 'netfreak2k-backup-scheduler.timer' scripts/update-server.sh
          test -f host/netfreak2k-backup-scheduler.service
          test -f host/netfreak2k-backup-scheduler.timer
          test -x scripts/backup-scheduler.sh || test -f scripts/backup-scheduler.sh

      - name: Notification center sanity
        run: |
          grep -q 'notification-panel' dashboard/index.html
          grep -q 'loadNotifications' dashboard/app.js
          grep -q 'CREATE TABLE IF NOT EXISTS notifications' server/api/server.py
          grep -q 'notifications_payload' server/api/server.py
          grep -q '/notifications/read' server/api/server.py

      - name: System Health sanity
        run: |
          grep -q 'health-panel' dashboard/index.html
          grep -q 'loadSystemHealth' dashboard/app.js
          grep -q 'health_status_payload' host/vm-agent.py
          grep -q 'CREATE TABLE IF NOT EXISTS health_samples' server/api/server.py
          grep -q '/health' server/api/server.py
          grep -q 'smartmontools' install.sh
          grep -q 'smartmontools' scripts/update-server.sh

      - name: Network inventory sanity
        run: |
          grep -q 'network-device-inventory' dashboard/index.html
          grep -q 'network-device-card-grid' dashboard/index.html
          grep -q 'network-device-card' dashboard/styles.css
          grep -q 'scanNetworkInventory' dashboard/app.js
          grep -q 'network_device_analyze' host/vm-agent.py
          grep -q 'network_scan_payload' host/vm-agent.py
          grep -q '/network/devices' server/api/server.py
          grep -q '/network/scan' server/api/server.py
          grep -q 'arp-scan' install.sh
          grep -q 'nmap' scripts/update-server.sh

      - name: HAOS provisioning sanity
        run: |
          grep -q 'haos_ova-' scripts/provision-haos.sh
          grep -q -- '--boot uefi' scripts/provision-haos.sh
          grep -q 'netfreak2k-homeassistant' scripts/provision-haos.sh
          grep -q 'qemu-kvm' install.sh
          grep -q 'libvirt-daemon-system' install.sh

      - name: Wallpaper asset sanity
        run: |
          test "$(find dashboard/assets/wallpapers -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 10
          grep -q 'N2K PERSONALISIERUNG' dashboard/index.html
          grep -q '09-cyber-city' dashboard/app.js
          grep -q 'N2K wallpaper collection' THIRD_PARTY_NOTICES.md

      - name: Update experience sanity
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS sessions' server/api/server.py
          grep -q 'session_token_hash' server/api/server.py
          grep -q 'update-experience' dashboard/index.html
          grep -q 'pollUpdateExperience' dashboard/app.js
          grep -q '/update/progress' server/api/server.py

      - name: GitHub update sanity
        run: |
          grep -q 'archive/refs/heads' scripts/check-updates.sh
          grep -q 'sha256sum' scripts/check-updates.sh
          grep -q 'installed_fingerprint' scripts/check-updates.sh
          grep -q 'fingerprint' scripts/update-server.sh
          grep -q 'netfreak2k-update-check.timer' install.sh

      - name: Stop test stack
        if: always()
        env:
          N2K_HTTP_PORT: "18080"
        run: docker compose -f server/docker-compose.yml down -v --remove-orphans
