name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Repository preflight
        run: bash scripts/preflight.sh

      - name: Check package-list duplicates
        run: |
          cat config/packages/*.list \
            | sed -E '/^[[:space:]]*(#|$)/d' \
            | sort \
            | uniq -d \
            | tee /tmp/duplicates.txt
          test ! -s /tmp/duplicates.txt

      - name: Validate server compose
        run: docker compose -f server/docker-compose.yml config

      - name: Build server container
        run: docker compose -f server/docker-compose.yml build

      - name: Server smoke test
        env:
          N2K_HTTP_PORT: "18080"
        run: |
          docker compose -f server/docker-compose.yml up -d
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:18080/api/status | grep -q '"product":"Netfreak2k Server"'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f server/docker-compose.yml logs
          exit 1

      - name: Stop test stack
        if: always()
        env:
          N2K_HTTP_PORT: "18080"
        run: docker compose -f server/docker-compose.yml down --remove-orphans
