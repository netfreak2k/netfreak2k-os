name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Repository preflight
        run: bash scripts/preflight.sh

      - name: Check package-list duplicates
        run: |
          cat config/packages/*.list \
            | sed -E '/^[[:space:]]*(#|$)/d' \
            | sort \
            | uniq -d \
            | tee /tmp/duplicates.txt
          test ! -s /tmp/duplicates.txt

      - name: Validate server compose
        run: docker compose -f server/docker-compose.yml config

      - name: Build server container
        run: docker compose -f server/docker-compose.yml build

      - name: Server smoke test
        env:
          N2K_HTTP_PORT: "18080"
        run: |
          docker compose -f server/docker-compose.yml down -v --remove-orphans || true
          docker compose -f server/docker-compose.yml up -d

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/api/setup | grep -q '"configured":false'

          SETUP_RESPONSE="$(curl -fsS \
            -c /tmp/n2k-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciadmin","password":"ci-test-password-123"}' \
            http://127.0.0.1:18080/api/setup)"

          CSRF="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["csrf"])' <<<"$SETUP_RESPONSE")"

          curl -fsS \
            -b /tmp/n2k-cookies.txt \
            http://127.0.0.1:18080/api/status \
            | grep -q '"product":"Netfreak2k Server"'

          for i in {1..20}; do
            APPS_JSON="$(curl -fsS -b /tmp/n2k-cookies.txt http://127.0.0.1:18080/api/apps)"
            if grep -q '"available":true' <<<"$APPS_JSON"; then
              grep -q '"containers":' <<<"$APPS_JSON"
              break
            fi
            sleep 1
          done
          grep -q '"available":true' <<<"$APPS_JSON"

          curl -fsS \
            -b /tmp/n2k-cookies.txt \
            -H "X-CSRF-Token: $CSRF" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:18080/api/logout \
            | grep -q '"authenticated":false'

      - name: Stop test stack
        if: always()
        env:
          N2K_HTTP_PORT: "18080"
        run: docker compose -f server/docker-compose.yml down -v --remove-orphans
