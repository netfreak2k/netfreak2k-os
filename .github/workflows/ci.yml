name: Netfreak2k OS CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n core/usr/local/bin/n2k
          for f in core/usr/local/lib/netfreak2k/*; do bash -n "$f"; done
      - name: Required project files
        run: |
          test -s VERSION
          test -s dashboard/index.html
          test -s docs/ARCHITECTURE.md
          test -s packages/common.txt
          test -s platform/raspberry-pi/packages.txt
          test -s platform/x86_64/packages.txt

  build-matrix:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rpi-arm64, amd64-iso, proxmox-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare target
        run: bash scripts/build-target.sh "${{ matrix.target }}"
      - name: Upload developer build manifest
        uses: actions/upload-artifact@v4
        with:
          name: netfreak2k-os-${{ matrix.target }}
          path: build/output/${{ matrix.target }}/
