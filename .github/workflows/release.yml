name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          [[ "${version}" == "${tag}" ]] || {
            echo "VERSION (${version}) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          }
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          shellcheck install.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
          python3 -m py_compile server/api/server.py server/collector/collector.py host/vm-agent.py
          node --check dashboard/app.js
          bash scripts/preflight.sh
          docker compose -f server/docker-compose.yml config
          docker compose -f server/docker-compose.yml build

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          git archive --format=tar.gz --prefix="netfreak2k-os-${version}/" -o "dist/netfreak2k-os-${version}.tar.gz" HEAD
          sha256sum "dist/netfreak2k-os-${version}.tar.gz" > "dist/netfreak2k-os-${version}.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="dist/netfreak2k-os-${version}.tar.gz"
          checksum="${archive}.sha256"
          prerelease=()
          if [[ "${version}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" "${checksum}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${archive}" "${checksum}"               --title "Netfreak2k Server-OS ${version}"               --generate-notes "${prerelease[@]}"
          fi
