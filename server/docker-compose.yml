services:
  netfreak2k-collector:
    build:
      context: ..
      dockerfile: server/collector/Dockerfile
    container_name: netfreak2k-collector
    restart: unless-stopped
    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      N2K_COLLECT_INTERVAL: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netfreak2k-inventory:/state

  netfreak2k-api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    container_name: netfreak2k-api
    restart: unless-stopped
    environment:
      N2K_VERSION: "0.1.0-dev"
      N2K_DATA_DIR: "/data"
      N2K_APPS_FILE: "/inventory/apps.json"
    volumes:
      - /proc:/host/proc:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - netfreak2k-data:/data
      - netfreak2k-inventory:/inventory:ro
    networks:
      - netfreak2k

  netfreak2k-web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: netfreak2k-web
    restart: unless-stopped
    depends_on:
      - netfreak2k-api
    ports:
      - "${N2K_HTTP_PORT:-80}:80"
    networks:
      - netfreak2k

networks:
  netfreak2k:
    name: netfreak2k

volumes:
  netfreak2k-data:
    name: netfreak2k-data
  netfreak2k-inventory:
    name: netfreak2k-inventory
