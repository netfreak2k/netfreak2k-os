services:
  netfreak2k-collector:
    build:
      context: ..
      dockerfile: server/collector/Dockerfile
    container_name: netfreak2k-collector
    labels:
      netfreak2k.core: "true"
    restart: unless-stopped
    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      N2K_COLLECT_INTERVAL: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netfreak2k-inventory:/state

  netfreak2k-messenger:
    build:
      context: ..
      dockerfile: server/messenger/Dockerfile
    container_name: netfreak2k-messenger
    labels:
      netfreak2k.core: "true"
      netfreak2k.managed: "true"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - netfreak2k-messenger-data:/state
    networks:
      - netfreak2k

  netfreak2k-api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    container_name: netfreak2k-api
    labels:
      netfreak2k.core: "true"
    restart: unless-stopped
    environment:
      N2K_VERSION: "0.2.0-dev"
      N2K_DATA_DIR: "/data"
      N2K_APPS_FILE: "/inventory/apps.json"
      N2K_VM_AGENT_SOCKET: "/run/netfreak2k/vm-agent.sock"
      N2K_AGENT_TOKEN_FILE: "/host/netfreak2k/agent.token"
      N2K_UPDATE_FILE: "/host/netfreak2k/update-status.json"
      N2K_WORKSPACE_ROOT: "/workspace"
    volumes:
      - /proc:/host/proc:ro
      # Read-only host hardware monitoring: hwmon fan tachometers across vendors
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /run/netfreak2k:/run/netfreak2k
      - /var/lib/netfreak2k:/host/netfreak2k:ro
      - /srv/netfreak2k:/workspace
      - netfreak2k-data:/data
      - netfreak2k-inventory:/inventory:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - netfreak2k

  netfreak2k-web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: netfreak2k-web
    labels:
      netfreak2k.core: "true"
    restart: unless-stopped
    depends_on:
      netfreak2k-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N2K_BACKEND_PORT:-18080}:80"
    networks:
      - netfreak2k

networks:
  netfreak2k:
    name: netfreak2k

volumes:
  netfreak2k-messenger-data:
    name: netfreak2k-messenger-data
  netfreak2k-data:
    name: netfreak2k-data
  netfreak2k-inventory:
    name: netfreak2k-inventory
